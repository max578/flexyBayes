url: https://aagi-aus.github.io/flexyBayes/

template:
  bootstrap: 5
  bootswatch: cosmo
  opengraph:
    twitter:
      card: summary_large_image

development:
  mode: auto

home:
  title: flexyBayes — Flexible Bayesian mixed models with ASReml and brms-style syntax
  description: >
    Specify mixed models using ASReml-style or brms-style formula syntax,
    estimate them via greta or INLA, and triangulate posterior agreement
    across engines as a robustness signal.

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/flexyBayes-01-getting-started.html
    articles:
      text: Tutorials
      menu:
        - text: "Foundations"
        - text: 01 — Getting started
          href: articles/flexyBayes-01-getting-started.html
        - text: 02 — asreml-shaped formulas
          href: articles/flexyBayes-02-asreml-formulas.html
        - text: 03 — Foundational regression
          href: articles/flexyBayes-03-regression.html
        - text: "---"
        - text: "Core mixed-model concepts"
        - text: 04 — Hierarchical models
          href: articles/flexyBayes-04-hierarchical.html
        - text: 05 — Structured covariance
          href: articles/flexyBayes-05-structured-covariance.html
        - text: 06 — Priors and regularisation
          href: articles/flexyBayes-06-priors.html
        - text: "---"
        - text: "Applied workflows"
        - text: 07 — METs and genomic selection
          href: articles/flexyBayes-07-met-and-genomics.html
        - text: 08 — Downstream analysis
          href: articles/flexyBayes-08-downstream-analysis.html
        - text: 09 — Spatio-temporal models
          href: articles/flexyBayes-09-spatio-temporal.html
        - text: "---"
        - text: "Advanced & internals"
        - text: 10 — Cross-engine triangulation
          href: articles/flexyBayes-10-triangulation.html
        - text: 11 — LGM feasibility filter
          href: articles/flexyBayes-11-lgm-feasibility.html
        - text: 12 — Backend internals
          href: articles/flexyBayes-12-backend-internals.html

reference:
  - title: Verbs
    desc: >
      The six exported verbs (architecturally final at v0.4.0, ADR 0030):
      fitting surfaces, the feasibility planner, cross-engine
      triangulation, and approximation validation.
    contents:
      - flexybayes
      - fb
      - fb_brms
      - fb_greta
      - fb_plan
      - triangulate
      - validate_approximation
  - title: Constructor nouns
    desc: >
      The four classed input constructors: priors, covariance carriers,
      approximation schemes, and engine selections.
    contents:
      - fb_prior
      - fb_cov
      - fb_approx
      - fb_engine
      - is_fb_cov
      - is_fb_approx
      - is_fb_engine
  - title: Accessors and discovery
    desc: Routing trace, refusal vocabulary, prior summary, and status.
    contents:
      - backend_decision
      - fb_refusals
      - prior_summary
      - gretaR_status
  - title: Cross-package interop
    desc: Tidiers, emmeans, and draws conversion.
    contents:
      - has_concept("interop")
      - tidy.flexybayes
      - glance.flexybayes
      - augment.flexybayes
      - emm_basis.flexybayes
      - recover_data.flexybayes
      - fb_as_draws_simple
  - title: Datasets
    contents:
      - has_keyword("datasets")
  - title: Package
    contents:
      - flexyBayes-package

articles:
  - title: Foundations
    navbar: ~
    contents:
      - flexyBayes-01-getting-started
      - flexyBayes-02-asreml-formulas
