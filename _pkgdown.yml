url: https://aagi-aus.github.io/flexyBayes/

template:
  bootstrap: 5
  bootswatch: cosmo
  opengraph:
    twitter:
      card: summary_large_image

development:
  mode: auto

home:
  title: flexyBayes — Flexible Bayesian mixed models with ASReml and brms-style syntax
  description: >
    Specify mixed models using ASReml-style or brms-style formula syntax,
    estimate them via greta or INLA, and triangulate posterior agreement
    across engines as a robustness signal.

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/flexyBayes-getting-started.html
    articles:
      text: Articles
      menu:
        - text: "Foundations"
        - text: Getting started
          href: articles/flexyBayes-getting-started.html
        - text: ASReml-style formulas
          href: articles/flexyBayes-asreml-formulas.html
        - text: Priors and the PC default
          href: articles/flexyBayes-priors.html
        - text: "---"
        - text: "Inference & dispatch"
        - text: Backend internals
          href: articles/flexyBayes-backend-internals.html
        - text: LGM feasibility filter
          href: articles/flexyBayes-lgm-feasibility.html
        - text: Cross-engine triangulation
          href: articles/flexyBayes-triangulation.html
        - text: Downstream analysis
          href: articles/flexyBayes-downstream-analysis.html
        - text: "---"
        - text: "Modelling vignettes"
        - text: Regression
          href: articles/flexyBayes-regression.html
        - text: Hierarchical models
          href: articles/flexyBayes-hierarchical.html
        - text: Structured covariance
          href: articles/flexyBayes-structured-covariance.html
        - text: Spatio-temporal
          href: articles/flexyBayes-spatio-temporal.html
        - text: METs and genomics
          href: articles/flexyBayes-met-and-genomics.html

reference:
  - title: User-facing entry points
    desc: Top-level functions for fitting, specifying, and comparing models.
    contents:
      - flexybayes
      - fb
      - fb_prior
      - triangulate
  - title: Cross-package interop
    desc: Tidiers, emmeans, and draws conversion.
    contents:
      - has_concept("interop")
      - tidy.flexybayes
      - glance.flexybayes
      - augment.flexybayes
      - emm_basis.flexybayes
      - recover_data.flexybayes
      - fb_as_draws_simple
  - title: Datasets
    contents:
      - has_keyword("datasets")
  - title: Package
    contents:
      - flexyBayes-package

articles:
  - title: Foundations
    navbar: ~
    contents:
      - flexyBayes-getting-started
      - flexyBayes-asreml-formulas
      - flexyBayes-priors
  - title: Inference and dispatch
    contents:
      - flexyBayes-backend-internals
      - flexyBayes-lgm-feasibility
      - flexyBayes-triangulation
      - flexyBayes-downstream-analysis
  - title: Modelling
    contents:
      - flexyBayes-regression
      - flexyBayes-hierarchical
      - flexyBayes-structured-covariance
      - flexyBayes-spatio-temporal
      - flexyBayes-met-and-genomics
