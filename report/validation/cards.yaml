# cards.yaml -- flexyBayes validation cards. One entry per card.
# TODO(author): set capability/tasks/oracles/competitors/primitives per card; add
# non-flagship cards as the study grows. Every claim needs >=1 oracle the
# package did not author (analytic / quadrature / simulation / competitor /
# independent reference).
- id: fb-correctness
  title: "flexybayes: Gaussian fixed-effects recovery vs lm() (exact)"
  capability: fb
  functions:  [flexybayes]
  tasks:      [correctness, coefficient-recovery]
  scenarios:  [gaussian-fixed-effects]
  primitives: [gaussian-linear-regression]
  oracles:    [lm-exact, dgp-truth]
  competitors: [stats::lm]
  flagship:   true
- id: fb-inla-correctness
  title: "flexybayes (INLA): sleepstudy LMM vs standalone INLA + lme4"
  capability: fb-inla
  functions:  [flexybayes, fb_inla]
  tasks:      [correctness, translation-fidelity]
  scenarios:  [random-intercept-lmm]
  primitives: [random-intercept-gaussian-lmm]
  oracles:    [standalone-inla, lme4-reml]
  competitors: [INLA::inla, lme4::lmer]
  flagship:   true
- id: fb-greta-correctness
  title: "fb_greta: sleepstudy LMM via greta/TF-HMC vs lme4"
  capability: fb-greta
  functions:  [fb_greta]
  tasks:      [correctness]
  scenarios:  [random-intercept-lmm]
  primitives: [random-intercept-gaussian-lmm]
  oracles:    [lme4-reml]
  competitors: [lme4::lmer]
  flagship:   true
- id: fb-brms-correctness
  title: "fb_brms: sleepstudy LMM via brms/Stan-HMC vs standalone brms + lme4"
  capability: fb-brms
  functions:  [fb_brms]
  tasks:      [correctness, translation-fidelity]
  scenarios:  [random-intercept-lmm]
  primitives: [random-intercept-gaussian-lmm]
  oracles:    [lme4-reml, standalone-brms]
  competitors: [brms::brm, lme4::lmer]
  flagship:   true
