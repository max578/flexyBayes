# Notation and abbreviations rendered as a definition list at the front of each
# document. One entry per term: {term, abbr, def}.
- term: "Linear mixed model"
  abbr: "LMM"
  def: "A regression with both fixed effects (population-level slopes) and random effects (group-level deviations, such as a per-subject intercept)."
- term: "Restricted maximum likelihood"
  abbr: "REML"
  def: "The estimator linear-mixed-model packages use for variance components; it corrects the downward bias of plain maximum likelihood. The reference fit in this study."
- term: "Integrated nested Laplace approximation"
  abbr: "INLA"
  def: "A deterministic approximate-inference method for latent Gaussian models. It returns posterior summaries without sampling, so its result is reproducible to numerical precision."
- term: "Hamiltonian Monte Carlo"
  abbr: "HMC"
  def: "A gradient-based Markov-chain Monte Carlo sampler. Both the greta and the brms backends draw posterior samples with HMC-family algorithms."
- term: "No-U-Turn Sampler"
  abbr: "NUTS"
  def: "The self-tuning variant of Hamiltonian Monte Carlo used by Stan, and therefore by the brms backend."
- term: "Posterior"
  abbr: ""
  def: "The distribution of a parameter after combining the prior with the data. A Bayesian point estimate is a posterior summary, typically the mean or median."
- term: "Standard error"
  abbr: "SE"
  def: "The estimated standard deviation of an estimator. Agreement here is judged on the scale of the reference fit's standard error, so a small absolute difference is read relative to the sampling noise."
- term: "Triangulation"
  abbr: ""
  def: "Fitting the same model specification through more than one estimation backend and treating cross-backend agreement as a robustness signal."
- term: "ASReml-style syntax"
  abbr: ""
  def: "A formula convention that names fixed, random, and residual-covariance structures in separate arguments, familiar to users of mixed-model software in agriculture."
